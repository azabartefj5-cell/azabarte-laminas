# Locuta la edición narrativa de azabarte.com con la voz de Google (Gemini TTS) y publica el audio.
#
# Necesita UNO de estos secretos del repositorio (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY      clave GRATUITA de la API de Gemini (Google AI Studio). Es la de siempre: la usan la
#                       ejecución diaria, la que lanza publicar.cmd tras cada despliegue y las manuales.
#                       Con la capa gratuita va más despacio: lo que no quepa en la cuota del día se termina
#                       en las ejecuciones siguientes.
#   GEMINI_API_KEY_2    segunda clave GRATUITA, de otra cuenta (29-09-2026, decisión del investigador): cuando
#                       la primera agota su cuota del día, la ejecución sigue con esta (paso «…con la segunda
#                       clave gratuita»). Dobla lo que se graba cada día sin pagar. No se usa con «clave: pago».
#   GEMINI_API_KEY_PAGO clave DE PAGO (29-09-2026). Solo se usa si se lanza a mano con «clave: pago», por
#                       decisión expresa del investigador en ese momento.
#   OPENROUTER_API_KEY  clave de OpenRouter; usa el mismo modelo (google/gemini-3.8-flash-tts) con su crédito.
# Sin secreto, la ejecución termina enseguida con un aviso y no cambia nada.
#
# Variables opcionales (Settings → Secrets and variables → Actions → Variables):
#   VOZ_NOMBRE  voz de Google (por defecto la que ya tenga el manifiesto, y si no, Charon)
#   VOZ_RPM     tope de peticiones por minuto (útil con la capa gratuita, p. ej. 8)
#   VOZ_HILOS   peticiones a la vez (4)
#   VOZ_MODO    tramos (varios párrafos por petición: poca cuota y voz continua) o bloques (uno a uno)
#   WEB_URL     página de la edición narrativa (https://azabarte.com/)
#
# Cada ejecución lee la web publicada, locuta solo las pistas nuevas o cuyo texto ha cambiado, sube los MP3,
# y después el manifiesto audio.json con la dirección del CDN (jsDelivr) clavada al commit de esos MP3. Por
# último purga la caché del manifiesto. La web lo consulta al cargar: no hace falta volver a desplegarla.
name: Locutar la edición narrativa

on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'Solo estas pistas, separadas por comas (vacío = todo lo pendiente). Ej.: cap:sabemos,pj:P001'
        required: false
        default: ''
      max_pistas:
        description: 'Máximo de pistas en esta ejecución (0 = sin límite)'
        required: false
        default: '0'
      voz:
        description: 'Cambiar la voz (Charon, Orus, Iapetus, Rasalgethi, Sadaltager; femeninas: Gacrux, Sulafat). Vacío = la actual. Cambiarla relocuta todo y se conserva en adelante.'
        required: false
        default: ''
      forzar:
        description: 'Regenerar aunque el texto no haya cambiado'
        type: boolean
        default: false
      clave:
        description: 'Clave de Google: gratuita (la de siempre) o pago (solo si lo decide el investigador)'
        type: choice
        options: [gratuita, pago]
        default: gratuita
  push:
    # Audio subido a mano o desde otra sesión: solo se fija la base del CDN y se purga la caché.
    branches: [main]
    paths:
      - 'voz/narrativa/audio.json'
      - 'voz/narrativa/mp3/**'
  schedule:
    # A diario, después de que Google reinicie la cuota (medianoche de California, 7:00 u 8:00 UTC):
    # continúa lo que quedara por cuota y relocuta los textos que se hayan editado en la web.
    - cron: '17 9 * * *'

permissions:
  contents: write

concurrency:
  group: voz-narrativa
  cancel-in-progress: false

jobs:
  locutar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VOZ_NOMBRE: ${{ inputs.voz || vars.VOZ_NOMBRE || '' }}
      VOZ_RPM: ${{ vars.VOZ_RPM || '0' }}
      VOZ_HILOS: ${{ vars.VOZ_HILOS || '4' }}
      VOZ_MODO: ${{ vars.VOZ_MODO || '' }}
      VOZ_MAX_TRAMO: ${{ vars.VOZ_MAX_TRAMO || '' }}
      VOZ_IDIOMA: ${{ vars.VOZ_IDIOMA || '' }}
      VOZ_SEMILLA: ${{ vars.VOZ_SEMILLA || '' }}
      WEB_URL: ${{ vars.WEB_URL || 'https://azabarte.com/' }}
    steps:
      - name: Elegir motor
        id: motor
        env:
          GEMINI_API_KEY: ${{ inputs.clave == 'pago' && secrets.GEMINI_API_KEY_PAGO || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "::notice title=Clave de Google::${{ inputs.clave == 'pago' && 'DE PAGO (decisión del investigador)' || 'gratuita' }}"
          if [ -n "$GEMINI_API_KEY" ]; then echo "motor=gemini" >> "$GITHUB_OUTPUT"
          elif [ -n "$OPENROUTER_API_KEY" ]; then echo "motor=openrouter" >> "$GITHUB_OUTPUT"
          else
            echo "motor=" >> "$GITHUB_OUTPUT"
            echo "::warning title=Falta la clave de voz::Añada el secreto GEMINI_API_KEY u OPENROUTER_API_KEY en Settings → Secrets and variables → Actions."
          fi

      # La punta de la rama al empezar (no el commit que disparó una ejecución en cola) y todo el historial,
      # para saber si el manifiesto ya apunta a un commit con estos mismos MP3.
      - uses: actions/checkout@v4
        if: steps.motor.outputs.motor != ''
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.motor.outputs.motor != ''
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        if: steps.motor.outputs.motor != ''
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.motor.outputs.motor != ''
        run: pip install -r voz/narrativa/requirements.txt

      # Bloques sueltos de una pista a medias (si la cuota se acabó en mitad de un capítulo).
      - name: Recuperar los bloques ya locutados
        if: steps.motor.outputs.motor != ''
        uses: actions/cache/restore@v4
        with:
          path: voz/narrativa/.cache
          key: voz-bloques-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: voz-bloques-

      # Se niega (y para el trabajo) si la página no es la edición narrativa o llega sin capítulos.
      - name: Extraer los textos de la web publicada
        if: steps.motor.outputs.motor != ''
        run: node voz/narrativa/extraer_textos.mjs --url "$WEB_URL"

      - name: Locutar lo pendiente
        if: steps.motor.outputs.motor != ''
        env:
          GEMINI_API_KEY: ${{ inputs.clave == 'pago' && secrets.GEMINI_API_KEY_PAGO || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Si el vigilante de locutar.py ve una pista atascada (más de 30 min), vuelca la pila al registro y sale
        # con 4; lo terminado ya está guardado, así que se relanza y sigue con lo pendiente (hasta tres veces).
        run: |
          for intento in 1 2 3; do
            rc=0
            python voz/narrativa/locutar.py \
              --motor "${{ steps.motor.outputs.motor }}" \
              --solo "${{ inputs.solo }}" \
              --max-pistas "${{ inputs.max_pistas || '0' }}" \
              --limite-minutos 300 \
              --podar \
              ${{ inputs.forzar && '--forzar' || '' }} || rc=$?
            if [ "$rc" -ne 4 ]; then exit "$rc"; fi
            echo "::warning title=Voz::una pista se quedó atascada (intento $intento); se relanza y sigue con lo pendiente"
          done
          exit 4

      # Claves gratuitas extra (29 y 30-09-2026): cuando la primera agota su cuota del día, siguen, una tras otra,
      # GEMINI_API_KEY_2, GEMINI_API_KEY_3… (cada una, de otra cuenta, suma unas 10 peticiones al día). Continúan
      # donde lo dejó la anterior (mismos textos, caché de bloques y audio.json). Corren aunque el paso anterior acabe
      # con alguna pista fallida, pero no si se cancela la ejecución ni con «clave: pago». Una clave sin secreto se
      # salta. Tope de 30 min por clave (y 70 de plazo para el paso) dentro de los 350 del trabajo.
      - name: Locutar lo pendiente con las otras claves gratuitas
        if: ${{ !cancelled() && steps.motor.outputs.motor == 'gemini' && inputs.clave != 'pago' }}
        timeout-minutes: 70
        env:
          CLAVE_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CLAVE_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          for n in 2 3; do
            var="CLAVE_$n"; clave="${!var}"
            if [ -z "$clave" ]; then echo "Sin clave gratuita número $n."; continue; fi
            echo "::notice title=Clave de Google::gratuita número $n"
            GEMINI_API_KEY="$clave" python voz/narrativa/locutar.py --motor gemini --solo "${{ inputs.solo }}"               --max-pistas "${{ inputs.max_pistas || '0' }}" --limite-minutos 30 --podar || true
          done

      - name: Publicar el audio
        if: always() && steps.motor.outputs.motor != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash voz/narrativa/publicar.sh

      - name: Guardar los bloques de la pista a medias
        if: always() && steps.motor.outputs.motor != ''
        uses: actions/cache/save@v4
        with:
          path: voz/narrativa/.cache
          key: voz-bloques-${{ github.run_id }}-${{ github.run_attempt }}

      # Si algo ha fallado, el audio ya pagado queda descargable en la ejecución durante 30 días.
      - name: Conservar el audio generado
        if: failure() && steps.motor.outputs.motor != ''
        uses: actions/upload-artifact@v4
        with:
          name: voz-narrativa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            voz/narrativa/mp3/
            voz/narrativa/audio.json
          if-no-files-found: ignore
          retention-days: 30

  publicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fijar la base del CDN y purgar la caché del manifiesto
        env:
          GH_TOKEN: ${{ github.token }}
          PURGA_SIEMPRE: '1'
        run: bash voz/narrativa/publicar.sh
